<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- AdSense 공통 로더 -->
  <script src="/js/ads.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>
  
  <title>Timestamp Converter</title>
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;      
    }
    .card{border:1px solid #ddd; border-radius:12px; padding:16px; margin:12px 0;}
    input{width:100%; font-size:16px; padding:10px; border:1px solid #ccc; border-radius:10px;}
    button{padding:10px 14px; border:1px solid #ccc; border-radius:10px; background:#fff; cursor:pointer;}
    .row{display:flex; gap:8px; align-items:center;}
    .muted{color:#666; font-size:13px;}
    code{background:#f5f5f5; padding:2px 6px; border-radius:6px;}

      footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Timestamp Converter</h1>
  <p class="muted">유닉스 타임스탬프(초/밀리초) ↔ 날짜 변환</p>

  <div class="card">
    <h3>Timestamp → Date</h3>
    <input id="ts" placeholder="예: 1700000000 또는 1700000000000" />
    <div class="row" style="margin-top:8px;">
      <button onclick="toDate()">변환</button>
      <button onclick="nowTs()">지금 값 넣기</button>
    </div>
    <p id="tsOut" class="muted"></p>
  </div>

  <div class="card">
    <h3>Date → Timestamp</h3>
    <input id="dt" placeholder="예: 2026-01-15 12:34:56 (로컬 시간)" />
    <div class="row" style="margin-top:8px;">
      <button onclick="toTs()">변환</button>
      <button onclick="nowDt()">지금 값 넣기</button>
    </div>
    <p id="dtOut" class="muted"></p>
  </div>

  <p class="muted">팁: 초/밀리초 자동 판별. 결과는 로컬 시간 기준.</p>


    <footer>
    <p><a href="/">← 메인으로 돌아가기</a></p>
  </footer>


<script>
  function toDate() {
    const v = document.getElementById('ts').value.trim();
    if (!v) return set('tsOut', '값을 입력해줘.');
    const n = Number(v);
    if (!Number.isFinite(n)) return set('tsOut', '숫자만 입력해줘.');

    // 13자리면 ms로 간주
    const ms = String(Math.trunc(n)).length >= 13 ? n : n * 1000;
    const d = new Date(ms);
    if (isNaN(d.getTime())) return set('tsOut', '해석할 수 없는 값이야.');

    set('tsOut', `로컬 시간: <code>${fmt(d)}</code> / ISO: <code>${d.toISOString()}</code>`);
  }

  function toTs() {
    const s = document.getElementById('dt').value.trim();
    if (!s) return set('dtOut', '값을 입력해줘.');

    // "YYYY-MM-DD HH:mm:ss" 형태 지원
    const normalized = s.replace(' ', 'T');
    const d = new Date(normalized);
    if (isNaN(d.getTime())) return set('dtOut', '예: 2026-01-15 12:34:56 처럼 입력해줘.');

    const ms = d.getTime();
    set('dtOut', `초: <code>${Math.floor(ms/1000)}</code> / 밀리초: <code>${ms}</code>`);
  }

  function nowTs() {
    const ms = Date.now();
    document.getElementById('ts').value = String(ms);
    toDate();
  }

  function nowDt() {
    const d = new Date();
    document.getElementById('dt').value = fmt(d);
    toTs();
  }

  function fmt(d){
    const p = (x)=> String(x).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function set(id, html){ document.getElementById(id).innerHTML = html; }
</script>
</body>
</html>
