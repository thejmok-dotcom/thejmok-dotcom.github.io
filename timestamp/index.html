<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- AdSense 공통 로더 -->
  <script src="../js/ads.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>
  
  <title>Timestamp Converter</title>
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;      
    }
    .card{border:1px solid #ddd; border-radius:12px; padding:16px; margin:12px 0;}
    input{width:100%; font-size:16px; padding:10px; border:1px solid #ccc; border-radius:10px;}
    button{padding:10px 14px; border:1px solid #ccc; border-radius:10px; background:#fff; cursor:pointer;}
    .row{display:flex; gap:8px; align-items:center;}
    .muted{color:#666; font-size:13px;}
    code{background:#f5f5f5; padding:2px 6px; border-radius:6px;}

      footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>

  <meta name="description" content="Convert Unix timestamps (seconds or milliseconds) to human-readable dates and convert dates back to timestamps." />

</head>
<body>
 <h1>Timestamp Converter</h1>
<p class="muted">Convert Unix timestamps (seconds/milliseconds) ↔ dates</p>

  <div class="card">
    <h3>Timestamp → Date</h3>
    <input id="ts" placeholder="ex: 1700000000 또는 1700000000000" />
    <div class="row" style="margin-top:8px;">
      <button onclick="toDate()">Convert</button>
    <button onclick="nowTs()">Use Current Time</button>
    </div>
    <p id="tsOut" class="muted"></p>
  </div>

  <div class="card">
    <h3>Date → Timestamp</h3>
   <input id="dt" placeholder="e.g. 2026-01-15 12:34:56 (local time)" />
    <div class="row" style="margin-top:8px;">
      <button onclick="toTs()">Convert</button>
      <button onclick="nowDt()">Use Current Time</button>
    </div>
    <p id="dtOut" class="muted"></p>
  </div>

  <p class="muted"> Tip: Automatically detects seconds or milliseconds. Results are based on local time.</p>


    <footer>
    <p><a href="/">← Back to Home</a></p>
  </footer>

<script>
  function toDate() {
    const v = document.getElementById('ts').value.trim();
    if (!v) return set('tsOut', 'Please enter a value.');
    const n = Number(v);
    if (!Number.isFinite(n)) return set('tsOut', 'Please enter numbers only.');

    // Treat 13+ digits as milliseconds
    const ms = String(Math.trunc(n)).length >= 13 ? n : n * 1000;
    const d = new Date(ms);
    if (isNaN(d.getTime())) return set('tsOut', 'Unable to parse the value.');

    set(
      'tsOut',
      `Local time: <code>${fmt(d)}</code> / ISO: <code>${d.toISOString()}</code>`
    );
  }

  function toTs() {
    const s = document.getElementById('dt').value.trim();
    if (!s) return set('dtOut', 'Please enter a value.');

    // Supports "YYYY-MM-DD HH:mm:ss" format
    const normalized = s.replace(' ', 'T');
    const d = new Date(normalized);
    if (isNaN(d.getTime()))
      return set('dtOut', 'Example: 2026-01-15 12:34:56');

    const ms = d.getTime();
    set(
      'dtOut',
      `Seconds: <code>${Math.floor(ms / 1000)}</code> / Milliseconds: <code>${ms}</code>`
    );
  }

  function nowTs() {
    const ms = Date.now();
    document.getElementById('ts').value = String(ms);
    toDate();
  }

  function nowDt() {
    const d = new Date();
    document.getElementById('dt').value = fmt(d);
    toTs();
  }

  function fmt(d) {
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function set(id, html) {
    document.getElementById(id).innerHTML = html;
  }
</script>

</body>
</html>
