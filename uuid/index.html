<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UUID Generator | UUID v4 생성기</title>
  <meta name="description" content="UUID v4를 즉시 생성하는 간단한 무료 UUID Generator입니다." />

  <!-- AdSense 공통 로더 -->
  <script src="/js/ads.js"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 8px; }
    input {
      width: 100%;
      font-family: monospace;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 6px;
      margin-top: 8px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .muted {
      color: #666;
      font-size: 13px;
      margin-top: 6px;
    }
    .success {
      color: #0a7;
      margin-top: 10px;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>

  <h1>UUID Generator (v4)</h1>
  <p>버튼 한 번으로 UUID v4를 생성합니다.</p>

  <input id="uuid" readonly />

  <div class="row">
    <button onclick="generate()">Generate</button>
    <button onclick="copy()">Copy</button>
  </div>

  <div id="message"></div>

  <p class="muted">
    RFC 4122 규격의 UUID v4 (랜덤 기반)
  </p>

  <footer>
    <p><a href="/">← 메인으로 돌아가기</a></p>
  </footer>

<script>
  function generate() {
    // crypto API가 있으면 사용 (권장)
    if (window.crypto && crypto.randomUUID) {
      document.getElementById('uuid').value = crypto.randomUUID();
    } else {
      // fallback
      document.getElementById('uuid').value = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
        .replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
    }
    document.getElementById('message').innerHTML =
      '<div class="success">✔ 새 UUID 생성됨</div>';
  }

  function copy() {
    const input = document.getElementById('uuid');
    if (!input.value) return;
    input.select();
    input.setSelectionRange(0, 99999);
    document.execCommand('copy');
    document.getElementById('message').innerHTML =
      '<div class="success">✔ 클립보드에 복사됨</div>';
  }

  // 페이지 열리면 하나 자동 생성
  generate();
</script>

</body>
</html>
