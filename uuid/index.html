<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UUID Generator (v4)</title>
  <meta name="description" content="A simple and free online UUID v4 generator that instantly creates random UUIDs." />


  <!-- AdSense 공통 로더 -->
  <script src="../js/ads.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 8px; }
    input {
      width: 100%;
      font-family: monospace;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 6px;
      margin-top: 8px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .muted {
      color: #666;
      font-size: 13px;
      margin-top: 6px;
    }
    .success {
      color: #0a7;
      margin-top: 10px;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>

  <h1>UUID Generator (v4)</h1>
  <p>Generate a UUID v4 instantly with a single click.</p>

  <input id="uuid" readonly />

  <div class="row">
    <button onclick="generate()">Generate</button>
    <button onclick="copy()">Copy</button>
  </div>

  <div id="message"></div>

  <p class="muted">
    RFC 4122–compliant UUID v4 (random-based)
  </p>

  <footer>
    <p><a href="/">← Back to Home</a></p>
  </footer>

<script>
  function generate() {
    if (window.crypto && crypto.randomUUID) {
      document.getElementById('uuid').value = crypto.randomUUID();
    } else {
      // fallback
      document.getElementById('uuid').value = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
        .replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
    }
    document.getElementById('message').innerHTML =
       '<div class="success">✔ New UUID generated</div>';
  }

  function copy() {
    const input = document.getElementById('uuid');
    if (!input.value) return;
    input.select();
    input.setSelectionRange(0, 99999);
    document.execCommand('copy');
    document.getElementById('message').innerHTML =
       '<div class="success">✔ Copied to clipboard</div>';
  }

  
  generate();
</script>

</body>
</html>
