<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>Base64 Encode / Decode | Online Base64 Converter</title>

  <!-- AdSense 공통 로더 -->
  <script src="../js/ads.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>

  
  <meta name="description" content="문자열을 Base64로 인코딩하거나 디코딩하는 간단한 온라인 도구입니다." />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 8px; }
    textarea {
      width: 100%;
      height: 220px;
      font-family: monospace;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 6px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .error {
      color: #c00;
      margin-top: 10px;
    }
    .success {
      color: #0a7;
      margin-top: 10px;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>

  <h1>Base64 Encode / Decode</h1>
  <p>A simple tool to encode or decode strings using Base64.</p>

  <textarea id="input" placeholder="Enter text here"></textarea>

  
  <div class="row">
    <button onclick="encode()">Encode</button>
    <button onclick="decode()">Decode</button>
    <button onclick="clearText()">Clear</button>
  </div>

  <div id="message"></div>

  <footer>
    <p><a href="/">← Back to Home</a></p>
  </footer>

<script>
  function encode() {
    const input = document.getElementById('input');
    const msg = document.getElementById('message');
    try {
      input.value = btoa(unescape(encodeURIComponent(input.value)));
      msg.innerHTML = '<div class="success">✔ Base64 encoding completed.</div>';
    } catch (e) {
      msg.innerHTML = '<div class="error">❌ Encoding failed.</div>';
    }
  }

  function decode() {
    const input = document.getElementById('input');
    const msg = document.getElementById('message');
    try {
      input.value = decodeURIComponent(escape(atob(input.value)));
      msg.innerHTML = '<div class="success">✔ Base64 decoding completed.</div>';
    } catch (e) {
      msg.innerHTML = '<div class="error">❌ Decoding failed (invalid Base64 input).</div>';
    }
  }

  function clearText() {
    document.getElementById('input').value = '';
    document.getElementById('message').innerHTML = '';
  }
</script>


</body>
</html>
