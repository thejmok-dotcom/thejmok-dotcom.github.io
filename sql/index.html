<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL 쿼리를 보기 좋게 정렬하는 간단한 온라인</title>

  <!-- AdSense 공통 로더 -->
  <script src="../js/ads.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>

  
  <meta name="description" content="SQL 쿼리를 보기 좋게 정렬하는 간단한 온라인" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 8px; }
    textarea {
      width: 100%;
      height: 220px;
      font-family: monospace;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 6px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .error {
      color: #c00;
      margin-top: 10px;
    }
    .success {
      color: #0a7;
      margin-top: 10px;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
    a { color: #0366d6; text-decoration: none; }
  </style>
</head>
<body>

  <h1>SQL Formatter</h1>
  <p>SQL 쿼리를 보기 좋게 정렬하는 간단한 온라인 도구입니다.1</p>

  <textarea id="input" placeholder="여기에 SQL을 붙여넣으세요"></textarea>

  <div class="row">
    <button onclick="formatSQL()">Format</button>
    <button onclick="clearSQL()">Clear</button>

    <select id="db">
      <option value="sql">Standard SQL</option>
      <option value="mysql">MySQL</option>
      <option value="postgresql">PostgreSQL</option>
    </select>
  </div>

  <div id="message"></div>

  <footer>
    <p><a href="/">← 메인으로 돌아가기</a></p>
  </footer>

  <!-- SQL Formatter CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.0/dist/sql-formatter.min.js"></script>

  <script>
    function formatSQL() {
      const input = document.getElementById('input');
      const msg = document.getElementById('message');

      try {
        const formatted = sqlFormatter.format(input.value, {
          language: document.getElementById('db').value,
          indent: "  ",
          uppercase: true
        });

        input.value = formatted;
        msg.innerHTML = '<div class="success">✔ SQL 정렬 완료</div>';
      } catch (e) {
        msg.innerHTML = '<div class="error">❌ SQL 오류: ' + e.message + '</div>';
      }
    }

    function clearSQL() {
      document.getElementById('input').value = '';
      document.getElementById('message').innerHTML = '';
    }
  </script>

</body>

</html>
