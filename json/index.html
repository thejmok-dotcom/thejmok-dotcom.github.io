<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Formatter | JSON Pretty Print & Validate</title>
  <meta name="description" content="An online tool to format and validate JSON for better readability." />

  <!-- AdSense 공통 로더 -->
  <script src="../js/ads.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7009230262375984"
     crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin-bottom: 8px; }
    textarea {
      width: 100%;
      height: 260px;
      font-family: monospace;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      margin-right: 6px;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .error {
      color: #c00;
      margin-top: 10px;
    }
    .success {
      color: #0a7;
      margin-top: 10px;
    }
    a { color: #0366d6; text-decoration: none; }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>JSON Formatter</h1>
  <p>An online tool to format and validate JSON for better readability.</p>

  <textarea id="input" placeholder='Paste JSON here'></textarea>

  <div class="row">
    <button onclick="formatJson()">Format</button>
    <button onclick="minifyJson()">Minify</button>
    <button onclick="clearJson()">Clear</button>
  </div>

  <div id="message"></div>

  <footer>
    <p><a href="/">← Back to Home</a></p>
  </footer>

<script>
  function formatJson() {
    const input = document.getElementById('input');
    const msg = document.getElementById('message');
    try {
      const obj = JSON.parse(input.value);
      input.value = JSON.stringify(obj, null, 2);
      msg.innerHTML = '<div class="success">✔ Valid JSON.</div>';
    } catch (e) {
      msg.innerHTML = '<div class="error">❌ JSON Error: ' + e.message + '</div>';
    }
  }

  function minifyJson() {
    const input = document.getElementById('input');
    const msg = document.getElementById('message');
    try {
      const obj = JSON.parse(input.value);
      input.value = JSON.stringify(obj);
      msg.innerHTML = '<div class="success">✔ Minification completed.</div>';
    } catch (e) {
      msg.innerHTML = '<div class="error">❌ JSON Error: ' + e.message + '</div>';
    }
  }

  function clearJson() {
    document.getElementById('input').value = '';
    document.getElementById('message').innerHTML = '';
  }
</script>


</body>
</html>
